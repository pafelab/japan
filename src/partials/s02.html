  <div class="garden">
    <div class="garden__img" role="img" aria-label="Ryōan-ji's stone garden seen from the veranda on an overcast morning: white gravel raked in straight lines, and in rings around fifteen dark stones set in five groups, each group on a small island of moss; behind them a long, low earthen wall in tawny clay, mottled by the oil seeping out of it, under a grey tiled cap, with summer trees and a pine beyond; in the foreground, the dark polished boards of the veranda.">

    <blockquote class="haiku" lang="ja">
      <p class="line">閑さや</p>
      <p class="line">岩にしみ入る</p>
      <p class="line">蝉の声</p>
    </blockquote>
    <figcaption class="poem__cap">
      <p class="gloss"><span>Stillness—</span> <span>seeping into the rocks,</span> <span>the cicadas’ cry</span></p>
      <p class="poem__credit">Matsuo Bashō, 1689 <span class="poem__source"><cite>Oku no Hosomichi</cite>, written at Yamadera</span></p>
    </figcaption>

  <div class="s02__foot">
    <div class="s02__intro">
      <h2 id="s02-title" class="s02__title"><span class="s02__kanji" lang="ja">静寂</span> <span class="s02__en">Echoes of Stillness</span></h2>
      <p class="s02__text">Ryōan-ji, Kyoto: fifteen stones in five groups on raked white gravel, behind a low wall of oiled clay. The garden is said to be arranged so that all fifteen stones can never be seen at once from any one point on the veranda.</p>

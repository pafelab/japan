<section class="s05" id="s05" aria-labelledby="s05-title">
  <!-- S05 匠 Takumi · three workshops, each lit by its own light. Normal scroll; the core moves each
       .plate at its data-speed and leans .plate__img toward the cursor (no CSS transforms on either).
       The rules at 28% | 72% continue S04's seam; the washi sheet at the bottom is the curtain over S06.
       -->
